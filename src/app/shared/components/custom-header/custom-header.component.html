<header class="flex items-center justify-end px-6 py-4 bg-surface border-b-4 border-secondary">
  <div class="flex items-center">

    <!-- Notifications Buttons -->
    <div class="relative">
      <button (click)="toggleNotifications()" class="flex mx-4 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 0 24 24" width="32px" fill="#000000">
          <path d="M0 0h24v24H0V0z" fill="none" />
          <path
            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z" />
        </svg>
      </button>

      <!-- Notifications Box -->
      @if (notificationOpen) {
        <shared-notifications-box></shared-notifications-box>
      }
    </div>

    <!-- Profile Button -->
    <div class="relative">
      <button (click)="toggleProfile()" class="block w-8 h-8 overflow-hidden rounded-full shadow focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 0 24 24" width="32px">
            <g>
              <g>
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM7.35 18.5C8.66 17.56 10.26 17 12 17s3.34.56 4.65 1.5c-1.31.94-2.91 1.5-4.65 1.5s-3.34-.56-4.65-1.5zm10.79-1.38C16.45 15.8 14.32 15 12 15s-4.45.8-6.14 2.12C4.7 15.73 4 13.95 4 12c0-4.42 3.58-8 8-8s8 3.58 8 8c0 1.95-.7 3.73-1.86 5.12z" />
                <path
                  d="M12 6c-1.93 0-3.5 1.57-3.5 3.5S10.07 13 12 13s3.5-1.57 3.5-3.5S13.93 6 12 6zm0 5c-.83 0-1.5-.67-1.5-1.5S11.17 8 12 8s1.5.67 1.5 1.5S12.83 11 12 11z" />
              </g>
            </g>
          </svg>
      </button>

      <!-- Profile Dropdown Menu -->
      @if (profileOpen) {
        <shared-dropdown-menu ></shared-dropdown-menu>
      }
    </div>
  </div>
</header>
