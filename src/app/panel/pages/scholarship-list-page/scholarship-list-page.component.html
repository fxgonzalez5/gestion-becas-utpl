<div class="h-full flex flex-col md:my-6 sm:my-4 mx-8">

  <!-- Sección de Formulario -->
  <section class="flex items-center justify-between">

    <!-- Grupo Izquierdo -->
    <h2 class="md:text-3xl sm:text-2xl text-primary font-medium">Seleccione año y período de ayuda</h2>
    <h2 class="md:text-4xl sm:text-2xl text-secondary font-medium">|</h2>

    <!-- Grupo Derecho -->
    @for (filter of filters(); track $index; let first = $first, last = $last) {
      <panel-options-menu [width]="first ? 'w-24' : last ? 'w-40' : ''" [label]="filter"
        [options]="getOptions(filter)" (selectionChange)="onFilterChange($event, filter)">
      ></panel-options-menu>
    }
  </section>

  <!-- Línea divisoria -->
  <hr class="my-4 border border-primary"/>

  <!-- Sección de Tarjetas -->
  <section class="flex-1 flex flex-col min-h-0">

    <!-- Encabezado -->
    <div class="flex-none flex items-center justify-between mb-5">
      <h2 class="md:text-3xl sm:text-2xl text-primary font-medium">Seleccione el tipo de beca</h2>
      <panel-options-menu label="Categoría" [options]="categories()"
        (selectionChange)="onFilterChange($event, 'categoría')"
      ></panel-options-menu>
    </div>

    <!-- Tarjetas -->
    <div class="flex-1 overflow-y-auto">
      <div class="flex flex-wrap gap-6">
        @for (scholarship of displayedScholarships(); track scholarship.id) {
          @if (scholarship.is_with_application) {
            <panel-scholarship-card [scholarship]="scholarship" [appliedScholarshipId]="appliedScholarshipId()"
              [currentYear]="currentYear()" [currentPeriod]="currentPeriod()" [currentModality]="currentModality()"
            ></panel-scholarship-card>
          }
        }
      </div>

      @if (!showButton()) {
        <!-- Botón Cargar Menos -->
        <div class="flex-none text-center py-2">
          <button (click)="onLoadMore()" mat-button>Ver menos -</button>
        </div>
      } @else {
        <!-- Botón Cargar Más -->
        <div class="flex-none text-center py-2">
          <button (click)="onLoadMore()" mat-button>Ver más +</button>
        </div>
      }
    </div>
    <div class="md:h-6 sm:h-4"></div>
  </section>
</div>
