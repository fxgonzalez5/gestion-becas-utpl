<div class="h-full flex flex-col md:my-6 sm:my-4 mx-8">

  <!-- Título -->
  <h2 class="md:text-3xl sm:text-2xl text-primary font-medium">Requisitos de la beca</h2>

  <!-- Línea divisoria -->
  <hr class="my-4 border border-primary"/>

  <!-- Sección de Tarjetas -->
  <section class="flex-1 flex flex-col min-h-0 mt-4">

    <!-- Tarjetas -->
    <div class="flex-1 overflow-y-auto">
      <div class="flex flex-wrap gap-6">
        @for (requirement of requirementsList(); track requirement.id) {
          <panel-requirement-card [requirement]="requirement"></panel-requirement-card>
        }
      </div>
    </div>
  </section>
</div>
