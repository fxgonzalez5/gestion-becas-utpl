<mat-card class="md:w-[27.5rem] sm:w-[21.5rem] mb-2 md:p-5 sm:p-4 group hover:bg-primary hover:text-white transition-all duration-300">
  <!-- Encabezado de la Tarjeta -->
  <mat-card-header class="flex items-center md:h-[5.5rem] sm:h-[4.5rem] mb-2">

    <!-- Icono de Material -->
    <span class="material-icons mr-4 p-2 md:text-4xl sm:text-2xl text-primary bg-secondary rounded group-hover:text-white"
    >{{ scholarship.icon }}</span>

    <!-- Texto del Encabezado -->
    <div>
      <mat-card-title class="group-hover:text-white">{{ scholarship.type }}</mat-card-title>
      <mat-card-subtitle class="group-hover:text-white">
        Categoría: <span class="font-light">{{ scholarship.category }}</span>
      </mat-card-subtitle>
    </div>
  </mat-card-header>

  <!-- Contenido de la Tarjeta -->
  <mat-card-content class="md:h-20 sm:h-[4.5rem] md:text-base sm:text-sm">
    <p class="inline text-primary group-hover:text-white">
      <span class="font-medium">Dirigido a:</span>
       @if (scholarship.description.length <= 135 ) {
        {{ scholarship.description }}
       } @else {
        {{ scholarship.description.substring(0, 135) + '...' }}
       }
    </p>
    <a [href]="scholarship.url" class="text-secondary font-medium0">
      Más Info...
    </a>
  </mat-card-content>

  <mat-card-actions class="flex justify-end">
    <button mat-button
      (click)="onClick()"
      class="btn-card group-hover:bg-secondary">
      Postular
    </button>
  </mat-card-actions>
</mat-card>
